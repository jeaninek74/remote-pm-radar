databases:
  - name: remote-pm-radar-data
    plan: free
    region: oregon

services:
  - type: web
    name: remote-pm-radar
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remote-pm-radar-data
          property: connectionString
      - key: ENABLE_CRON
        value: "1"
      - key: JOB_WINDOW_DAYS
        value: "14"
      - key: EMPLOYERS_PER_RUN
        value: "600"
      - key: NODE_ENV
        value: production
