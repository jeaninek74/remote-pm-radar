name: Harvest employer job boards

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: harvest-boards
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsx scripts/harvest-boards.ts
