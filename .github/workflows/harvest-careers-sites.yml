name: Harvest employer careers sites

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: harvest-careers-sites
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: wdc-jobposting-2024-12-candidates.json
          key: wdc-jobposting-2024-12-v1

      - run: npx tsx scripts/harvest-careers-sites.ts
