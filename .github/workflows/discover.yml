name: Discover employers

# Employer discovery runs as its own pass in the gap between the :00/:30 sweeps. It probes the
# discovery queue (hundreds of thousands of companies across every industry and state) and adds
# every board it finds, with no count cap — only the time budget ends it, before the next sweep.

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start a discovery pass
        run: |
          # A sweep usually runs ~15 minutes from :00/:30, so the first attempts may meet a 409
          # (lock held). Retry each minute until the pass starts or the gap is nearly over.
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /tmp/out -m 60 -w '%{http_code}' -X POST https://remote-pm-radar.onrender.com/api/discover \
              -H 'Content-Type: application/json' -d '{}' || true)
            echo "attempt $attempt -> HTTP $code: $(cat /tmp/out)"
            if [ "$code" = "202" ]; then exit 0; fi
            sleep 60
          done
          echo "no gap found this half hour; the next trigger tries again"
          exit 0
